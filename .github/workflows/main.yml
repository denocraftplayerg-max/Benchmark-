name: Build AngleBenchmark APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle com Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-encryption-key: ${{ secrets.KEY_STORE_PASSWORD }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --build-cache

      - name: Assinar APK (Signer v3 nativo)
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Assinado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AngleBenchmark-Release-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error
